<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Schedule Pro - Mobile Friendly</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!-- Thư viện Lịch Âm -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Font Plus Jakarta Sans cực kỳ hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f4f7fe; 
            color: #1e293b;
        }

        /* Tùy biến thanh Toolbar của Lịch */
        .fc-toolbar-title { 
            font-size: 1.3rem !important; 
            font-weight: 800 !important; 
            color: #0f172a; 
            text-transform: capitalize; 
        }

        /* Nút bấm của FullCalendar */
        .fc .fc-button-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            border: none !important;
            border-radius: 10px !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            font-weight: 600 !important;
            padding: 0.5rem 1rem !important;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3) !important;
            text-transform: capitalize !important;
            transition: all 0.3s ease !important;
        }
        .fc .fc-button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4) !important;
        }
        .fc .fc-button-primary:not(:disabled):active, .fc .fc-button-primary:not(:disabled).fc-button-active {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important;
            transform: translateY(0);
        }

        /* Thiết kế các ô ngày trong Lịch */
        .fc-theme-standard .fc-scrollgrid { border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; }
        .fc-theme-standard th { padding: 12px 0; color: #64748b; font-weight: 700; font-size: 0.85rem; background: #f8fafc; border-color: #e2e8f0;}
        .fc-theme-standard td { border-color: #e2e8f0; }
        .fc-daygrid-day-frame { transition: all 0.2s ease; cursor: pointer; padding: 4px !important; }
        .fc-daygrid-day-frame:hover { background-color: #f1f5f9; }
        .fc-daygrid-day.fc-day-today .fc-daygrid-day-frame { background-color: #eff6ff; border-left: 3px solid #3b82f6 !important; }
        
        /* Sự kiện (Event) hiển thị trong lịch */
        .fc-event {
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: transform 0.15s;
            margin-bottom: 3px !important;
            cursor: pointer;
        }
        .fc-event:hover { transform: scale(1.02); }

        /* Typography cho Lịch Dương / Âm */
        .solar-date { font-size: 1.05rem; font-weight: 600; color: #334155; }
        .lunar-date { font-size: 0.75rem; color: #94a3b8; font-weight: 500; margin-top: -2px; }
        .lunar-first-day { color: #ef4444; font-weight: 700; }

        /* FIX RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .fc-header-toolbar { 
                flex-direction: column; 
                gap: 12px; 
            }
            .fc-toolbar-chunk { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; width: 100%; }
            .fc-toolbar-title { font-size: 1.1rem !important; }
            .fc .fc-button-primary { padding: 0.4rem 0.8rem !important; font-size: 0.8rem !important; }
            
            .solar-date { font-size: 0.9rem; }
            .lunar-date { font-size: 0.65rem; }
            
            /* Tối ưu hiển thị sự kiện trên ô Tháng của điện thoại */
            .fc-event { 
                font-size: 0.6rem !important; 
                padding: 2px 3px !important; 
                white-space: nowrap; 
                overflow: hidden; 
                text-overflow: ellipsis; 
            }
            .fc-daygrid-day-frame { padding: 2px !important; }
        }

        /* Modal Blur */
        .modal-backdrop { backdrop-filter: blur(5px); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="max-w-6xl mx-auto w-full mb-6 flex flex-col sm:flex-row justify-between items-center bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 gap-4">
        <div class="flex items-center gap-4">
            <div class="bg-gradient-to-br from-indigo-100 to-blue-100 p-3 rounded-2xl shadow-inner">
                <svg class="w-7 h-7 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-gray-800 tracking-tight">Quản Lý Lịch Trình</h1>
                <p class="text-xs sm:text-sm text-gray-500 font-medium mt-0.5">Đồng bộ Cloud & Thông báo</p>
            </div>
        </div>
        <button onclick="requestNotificationPermission()" class="w-full sm:w-auto group flex items-center justify-center gap-2 bg-white border-2 border-indigo-50 text-indigo-600 px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-50 hover:border-indigo-100 transition-all shadow-sm">
            <svg class="w-5 h-5 group-hover:animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            Bật thông báo
        </button>
    </header>

    <!-- Calendar Container -->
    <main class="max-w-6xl mx-auto w-full flex-grow bg-white p-3 sm:p-6 rounded-2xl shadow-sm border border-gray-100">
        <div id="calendar"></div>
    </main>

    <!-- Modal Form Sự Kiện -->
    <div id="eventModal" class="fixed inset-0 bg-gray-900/40 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden transform transition-all">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 shrink-0">
                <h2 class="text-lg font-extrabold text-gray-800" id="modalTitle">Thêm Lịch Mới</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <form id="eventForm" class="p-6 space-y-5 overflow-y-auto">
                <input type="hidden" id="eventId">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Tiêu đề công việc <span class="text-red-500">*</span></label>
                    <input type="text" id="eventTitle" required placeholder="Ví dụ: Họp dự án Q3..." class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:ring-0 focus:border-indigo-500 outline-none transition font-medium text-gray-800 bg-gray-50 focus:bg-white shadow-sm">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1.5">Bắt đầu</label>
                        <input type="datetime-local" id="eventStart" required class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:ring-0 focus:border-indigo-500 outline-none transition text-sm font-medium bg-gray-50 focus:bg-white shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1.5">Kết thúc</label>
                        <input type="datetime-local" id="eventEnd" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:ring-0 focus:border-indigo-500 outline-none transition text-sm font-medium bg-gray-50 focus:bg-white shadow-sm">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">Mô tả chi tiết</label>
                    <textarea id="eventDesc" rows="3" placeholder="Ghi chú thêm về sự kiện..." class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:ring-0 focus:border-indigo-500 outline-none transition resize-none font-medium text-gray-800 bg-gray-50 focus:bg-white shadow-sm"></textarea>
                </div>
                
                <div class="flex flex-col-reverse sm:flex-row justify-between items-center gap-3 pt-4 mt-2">
                    <button type="button" id="btnDelete" onclick="deleteEvent()" class="w-full sm:w-auto text-red-600 bg-red-50 hover:bg-red-100 px-5 py-3 rounded-xl font-bold transition hidden flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Xóa lịch
                    </button>
                    <div class="flex w-full sm:w-auto gap-3 ml-auto">
                        <button type="button" onclick="closeModal()" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition">Hủy</button>
                        <button type="submit" id="btnSave" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5">Lưu sự kiện</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // DÁN URL WEB APP CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby38HtHVVs7cTs7epu8uMv70oj9VExbeamNOtw8DwI3NZfq3NtfR7E4AqoDyODhnLAJ/exec';
        // ==========================================

        let calendar;
        let eventList = [];

        document.addEventListener('DOMContentLoaded', function() {
            initCalendar();
            loadEvents();
            setInterval(checkUpcomingEvents, 60000); 
        });

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                // ĐÃ SỬA: Luôn luôn mặc định mở chế độ xem theo Tháng (Month)
                initialView: 'dayGridMonth', 
                locale: 'vi',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,timeGridWeek,timeGridDay' 
                },
                buttonText: { today: 'Hôm nay', month: 'Tháng', week: 'Tuần', day: 'Ngày' },
                selectable: true,
                editable: false,
                contentHeight: 'auto', 
                
                dayCellContent: function(arg) {
                    let solarDate = arg.date;
                    let lunar = Lunar.fromDate(solarDate);
                    let lunarDay = lunar.getDay();
                    let lunarMonth = lunar.getMonth();
                    
                    let lunarText = (lunarDay === 1) ? `${lunarDay}/${lunarMonth}` : lunarDay;
                    let lunarClass = (lunarDay === 1 || lunarDay === 15) ? 'lunar-date lunar-first-day' : 'lunar-date';

                    return {
                        html: `<div class="flex flex-col items-center justify-center h-full pt-1">
                                 <span class="solar-date">${arg.dayNumberText.replace('ng ', '')}</span>
                                 <span class="${lunarClass}">${lunarText}</span>
                               </div>`
                    };
                },

                // ĐÃ XÓA TÍNH NĂNG TỰ ĐỘNG CHUYỂN NGÀY (WINDOW RESIZE) TẠI ĐÂY

                select: function(info) {
                    openModal();
                    document.getElementById('eventStart').value = info.startStr + (info.startStr.includes('T') ? '' : 'T09:00');
                    document.getElementById('eventEnd').value = info.startStr + (info.startStr.includes('T') ? '' : 'T10:00');
                },

                eventClick: function(info) { openModal(info.event); }
            });
            calendar.render();
        }

        function loadEvents() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    calendar.removeAllEvents();
                    eventList = data.map(item => ({
                        id: item.id,
                        title: item.title,
                        start: item.start,
                        end: item.end,
                        extendedProps: { description: item.description }
                    }));
                    calendar.addEventSource(eventList);
                })
                .catch(err => console.error("Lỗi tải dữ liệu", err));
        }

        function sendToGoogleSheet(action, data) {
            Swal.fire({ title: 'Đang xử lý...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass: { popup: 'rounded-2xl' } });

            const params = new URLSearchParams();
            params.append('action', action);
            if(data) params.append('data', JSON.stringify(data));

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    Swal.fire({ icon: 'success', title: 'Thành công!', showConfirmButton: false, timer: 1500, customClass: { popup: 'rounded-2xl' } });
                    closeModal();
                    loadEvents();
                } else {
                    Swal.fire('Lỗi!', res.error || 'Có lỗi xảy ra', 'error');
                }
            })
            .catch(err => {
                Swal.fire('Lỗi!', 'Không thể kết nối đến máy chủ.', 'error');
            });
        }

        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const eventData = {
                id: document.getElementById('eventId').value || 'evt_' + Date.now().toString(),
                title: document.getElementById('eventTitle').value,
                start: document.getElementById('eventStart').value,
                end: document.getElementById('eventEnd').value,
                description: document.getElementById('eventDesc').value
            };
            sendToGoogleSheet('save', eventData); 
        });

        function deleteEvent() {
            const id = document.getElementById('eventId').value;
            Swal.fire({
                title: 'Xóa lịch này?',
                text: "Dữ liệu sẽ bị xóa hoàn toàn!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl', cancelButton: 'rounded-xl' }
            }).then((result) => {
                if (result.isConfirmed) {
                    sendToGoogleSheet('delete', { id: id });
                }
            });
        }

        function openModal(event = null) {
            document.getElementById('eventModal').classList.remove('hidden');
            if (event) {
                document.getElementById('modalTitle').innerText = 'Chỉnh sửa lịch';
                document.getElementById('eventId').value = event.id;
                document.getElementById('eventTitle').value = event.title;
                
                let startLocal = new Date(event.start.getTime() - (event.start.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                document.getElementById('eventStart').value = startLocal;
                
                if (event.end) {
                    let endLocal = new Date(event.end.getTime() - (event.end.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                    document.getElementById('eventEnd').value = endLocal;
                } else {
                    document.getElementById('eventEnd').value = '';
                }
                
                document.getElementById('eventDesc').value = event.extendedProps.description || '';
                document.getElementById('btnDelete').classList.remove('hidden');
            } else {
                document.getElementById('modalTitle').innerText = 'Thêm Lịch Mới';
                document.getElementById('eventForm').reset();
                document.getElementById('eventId').value = '';
                document.getElementById('btnDelete').classList.add('hidden');
            }
        }

        function closeModal() { document.getElementById('eventModal').classList.add('hidden'); }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") Swal.fire({ icon: 'success', title: 'Đã bật thông báo!', showConfirmButton: false, timer: 1500, customClass: { popup: 'rounded-2xl' } });
                    else Swal.fire('Thông báo', 'Bạn đã từ chối quyền thông báo.', 'info');
                });
            }
        }

        function checkUpcomingEvents() {
            if (Notification.permission !== "granted") return;
            const now = new Date();
            const notifyTime = 15; 
            eventList.forEach(event => {
                let eventTime = new Date(event.start);
                let diffInMinutes = Math.floor((eventTime - now) / 60000);
                if (diffInMinutes === notifyTime) {
                    new Notification("Sắp đến lịch làm việc!", {
                        body: `${event.title} lúc ${eventTime.getHours()}:${eventTime.getMinutes().toString().padStart(2, '0')}`,
                    });
                }
            });
        }
    </script>
</body>
</html>
